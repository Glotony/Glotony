name: Update Profile Cards

on:
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/update-profile-cards.yml

permissions:
  contents: write

jobs:
  render-profile-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: Glotony
          cards: overview,momentum,contributions,lifetime,cadence,repositories,languages
          output-dir: assets
          themes: light,dark
          language-limit: 8
          commit: true
